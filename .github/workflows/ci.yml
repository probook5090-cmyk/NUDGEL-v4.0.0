name: Expo Go UI checks

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx expo export --platform android
      - run: npx expo export --platform ios
      - run: npx expo export --platform web
